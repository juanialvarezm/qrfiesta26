<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR de asistencia</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="page">
      <main class="card">
        <h1>Registro de asistencia</h1>
        <p class="lead">Compartí este código con quienes quieran registrar su asistencia.</p>

        <div class="qr-frame" id="qr-frame" hidden>
          <img id="qr" alt="Código QR de registro">
        </div>
        <p class="message" id="status">Generando código QR…</p>
        <a class="link" id="link" hidden></a>

        <div class="count">
          Asistencias confirmadas
          <strong id="count">—</strong>
        </div>

        <div class="btn-row">
          <a class="link-btn" href="/ruleta">Abrir la ruleta 🎁</a>
          <a class="link-btn link-btn--ghost" href="/admin">Panel privado</a>
        </div>
      </main>

      <section class="card card--wide">
        <div class="section-head">
          <h2>Asistentes</h2>
          <span class="pill" id="list-count">—</span>
        </div>
        <div class="list-scroll">
          <ul class="attendees" id="attendees">
            <li class="empty">Cargando…</li>
          </ul>
        </div>
      </section>
    </div>

    <script>
      fetch("/api/qr")
        .then((response) => {
          if (!response.ok) throw new Error("No se pudo generar el QR.");
          return response.json();
        })
        .then(({ image, checkInUrl, count }) => {
          const qr = document.querySelector("#qr");
          qr.src = image;
          document.querySelector("#qr-frame").hidden = false;
          document.querySelector("#status").textContent = "Escaneá el QR para registrar tu asistencia.";
          const link = document.querySelector("#link");
          link.href = checkInUrl;
          link.textContent = checkInUrl;
          link.hidden = false;
          document.querySelector("#count").textContent = count;
        })
        .catch((error) => {
          const status = document.querySelector("#status");
          status.textContent = error.message;
          status.classList.add("error");
        });

      fetch("/api/attendees")
        .then((response) => {
          if (!response.ok) throw new Error("No se pudo cargar el listado.");
          return response.json();
        })
        .then((attendees) => {
          document.querySelector("#list-count").textContent = attendees.length;
          const list = document.querySelector("#attendees");
          list.innerHTML = "";
          if (attendees.length === 0) {
            const empty = document.createElement("li");
            empty.className = "empty";
            empty.textContent = "Todavía no hay asistencias.";
            list.append(empty);
            return;
          }
          const sorted = [...attendees].sort(
            (a, b) => new Date(b.checkedInAt) - new Date(a.checkedInAt)
          );
          for (const attendee of sorted) {
            const item = document.createElement("li");
            const name = document.createElement("span");
            name.className = "name";
            name.textContent = attendee.name;
            const time = document.createElement("span");
            time.className = "time";
            time.textContent = new Date(attendee.checkedInAt).toLocaleString("es-AR");
            item.append(name, time);
            list.append(item);
          }
        })
        .catch(() => {
          const list = document.querySelector("#attendees");
          list.innerHTML = '<li class="empty">No se pudo cargar el listado.</li>';
        });
    </script>
  </body>
</html>
