<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR de asistencia</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="page">
      <main class="card">
        <h1>Registro de asistencia</h1>
        <p class="lead">Compartí este código con quienes quieran registrar su asistencia.</p>

        <div class="qr-frame" id="qr-frame" hidden>
          <img id="qr" alt="Código QR de registro">
        </div>
        <p class="message" id="status">Generando código QR…</p>
        <a class="link" id="link" hidden></a>

        <div class="count">
          Asistencias confirmadas
          <strong id="count">—</strong>
        </div>

        <div class="btn-row">
          <a class="link-btn" href="/ruleta">Abrir la ruleta 🎁</a>
          <a class="link-btn link-btn--ghost" href="/admin">Panel privado</a>
        </div>
      </main>
    </div>

    <script>
      fetch("/api/qr")
        .then((response) => {
          if (!response.ok) throw new Error("No se pudo generar el QR.");
          return response.json();
        })
        .then(({ image, checkInUrl, count }) => {
          const qr = document.querySelector("#qr");
          qr.src = image;
          document.querySelector("#qr-frame").hidden = false;
          document.querySelector("#status").textContent = "Escaneá el QR para registrar tu asistencia.";
          const link = document.querySelector("#link");
          link.href = checkInUrl;
          link.textContent = checkInUrl;
          link.hidden = false;
          document.querySelector("#count").textContent = count;
        })
        .catch((error) => {
          const status = document.querySelector("#status");
          status.textContent = error.message;
          status.classList.add("error");
        });
    </script>
  </body>
</html>
